name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Dummy — hanya untuk `prisma generate` (postinstall); test tidak butuh DB.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/lingomind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
