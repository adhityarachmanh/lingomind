name: Content Generation (cicil otomatis)

# Fokus English: tiap jam generate maks 12 unit konten (lesson/quiz) + 12 varian pool kelemahan
# untuk bahasa terpilih (default English). Idempotent & resume otomatis — run manual kapan pun
# via "Run workflow" (bisa pilih bahasa lain lewat input).
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      language:
        description: "Bahasa yang di-generate (default English)"
        required: false
        default: "English"

concurrency:
  group: content-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENCODE_AI_API_KEY: ${{ secrets.OPENCODE_AI_API_KEY }}
      OPENCODE_AI_ENDPOINT: ${{ secrets.OPENCODE_AI_ENDPOINT }}
      OPENCODE_AI_MODEL: ${{ secrets.OPENCODE_AI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Terapkan migration yang belum jalan
        run: npx prisma migrate deploy
      - name: Generate konten (maks 12 unit)
        run: npm run content:generate -- ${{ inputs.language || 'English' }} --max-units 12
      - name: Isi pool latihan kelemahan (maks 12 varian)
        run: npm run content:weakness -- ${{ inputs.language || 'English' }} --max-units 12
